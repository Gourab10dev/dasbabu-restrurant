<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<section class="contact">
    <div class="overlay">

        <h1 class="title">Contact Us</h1>
        <h3 class="subtitle">HOW TO GET IN TOUCH?</h3>
        <p class="desc">
            We are approachable and ready to accept reviews and prior bookings.
            Reach out to us anytime.
        </p>

        <div class="contact-container">

            <!-- LEFT SIDE -->
            <div class="contact-info">
                <h4>ADDRESS</h4>
                <p>372, Kesab Chandra Rd, Morepukur, Subhash Nagar 2, Rishra, Howrah, West Bengal 712250</p>
                
                <h4>PHONE NUMBER</h4>
                <p>+91 9831878279</p>

                <h4>EMAIL ADDRESS</h4>
                <p>contact@tech.com</p>

                <h4>FOLLOW US ON</h4>
                <div class="social">
                    <span><i class="fab fa-facebook-f"></i></span>
                    <span><i class="fab fa-instagram"></i></span>
                    <span><i class="fab fa-x-twitter"></i></span>
                    <span><i class="fab fa-reddit-alien"></i></span>
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="contact-form">
                <form>
                    <div class="row">
                        <input type="text" placeholder="Your Name">
                        <input type="email" placeholder="Your Email">
                    </div>

                    <input type="text" placeholder="Subject">
                    <textarea placeholder="Message"></textarea>

                    <button type="submit">BOOK A TABLE</button>
                </form>
            </div>

        </div>
    </div>
</section>

</body>
</html>
